<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全球衛星即時位置（離線版）</title>
<style>
  :root { --bg:#05080f; --panel:rgba(14,20,32,.92); --line:#243046; --txt:#dbe4f0; --dim:#8695ab; --acc:#5ab0ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); overflow:hidden;
    font:13px/1.5 "Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif; }
  #view { position:absolute; inset:0; }
  canvas { display:block; }
  .panel { position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:8px; backdrop-filter:blur(6px); }
  #left { top:10px; right:10px; bottom:10px; width:290px; display:flex; flex-direction:column; }
  #left h1 { font-size:15px; margin:0; padding:10px 12px 2px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #collapse { background:#0b111c; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:1px 8px; cursor:pointer; font:inherit; font-size:12px; white-space:nowrap; }
  #collapse:hover, #refresh:hover { border-color:var(--acc); }
  #refresh { background:#0b111c; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:0 6px; cursor:pointer; font:inherit; font-size:11px; white-space:nowrap; }
  #left.collapsed { bottom:auto; width:auto; height:auto; }
  #left.collapsed > :not(h1) { display:none; }
  #left.collapsed h1 { padding:6px; }
  #left.collapsed h1 span { display:none; }
  #left .sub { color:var(--dim); font-size:11px; padding:0 12px 8px; border-bottom:1px solid var(--line); }
  .sec { border-bottom:1px solid var(--line); }
  .sechead { padding:5px 12px; cursor:pointer; font-weight:600; color:var(--acc); background:rgba(90,176,255,.07); user-select:none; }
  .sechead::before { content:'▾ '; }
  .sec.closed .sechead::before { content:'▸ '; }
  .sechead:hover { background:rgba(90,176,255,.16); }
  .sec.closed .secbody { display:none; }
  .sec.grow { flex:1; min-height:0; display:flex; flex-direction:column; border-bottom:none; }
  .sec.grow.closed { flex:none; }
  .sec.grow .secbody { flex:1; min-height:0; display:flex; flex-direction:column; }
  #scheme { padding:6px 12px 0; display:flex; gap:4px; align-items:center; }
  #scheme button { background:#0b111c; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:1px 8px; cursor:pointer; font:inherit; font-size:12px; }
  #scheme button:hover { border-color:var(--acc); }
  #scheme button.on { background:var(--acc); color:#04101f; border-color:var(--acc); }
  #catall { margin-left:auto; display:flex; gap:4px; }
  #catall button { color:var(--dim); padding:1px 5px; font-size:11px; }
  #schemenote { display:none; padding:3px 12px 0; color:var(--dim); font-size:11px; }
  #cats { padding:6px 12px 8px; }
  #cats label { display:flex; align-items:center; gap:6px; cursor:pointer; padding:1px 0; }
  #cats .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  #cats .n { margin-left:auto; color:var(--dim); font-variant-numeric:tabular-nums; }
  #search { margin:8px 12px; padding:6px 8px; background:#0b111c; color:var(--txt); border:1px solid var(--line); border-radius:5px; outline:none; }
  #search:focus { border-color:var(--acc); }
  #listinfo { padding:0 12px 4px; color:var(--dim); font-size:11px; }
  #list { flex:1; overflow-y:auto; position:relative; border-top:1px solid var(--line); }
  #listinner { position:relative; }
  .row { position:absolute; left:0; right:0; height:22px; padding:0 12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    cursor:pointer; display:flex; align-items:center; gap:6px; }
  .row:hover { background:#16223a; }
  .row.sel { background:#1d3558; }
  .row .dot { width:7px; height:7px; border-radius:50%; flex:none; }
  .row .id { margin-left:auto; color:var(--dim); font-size:11px; }
  #time { top:10px; left:50%; transform:translateX(-50%); padding:6px 12px; display:flex; align-items:center; gap:8px; white-space:nowrap; }
  #time button { background:#0b111c; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:2px 8px; cursor:pointer; font:inherit; }
  #time button:hover { border-color:var(--acc); }
  #time button.on { background:var(--acc); color:#04101f; border-color:var(--acc); }
  #clock { font-variant-numeric:tabular-nums; min-width:215px; }
  #info { top:10px; left:10px; width:310px; max-height:calc(100% - 20px); overflow-y:auto; padding:12px; display:none; }
  #info h2 { margin:0 20px 2px 0; font-size:16px; word-break:break-word; }
  #info .tag { display:inline-block; padding:0 8px; border-radius:10px; font-size:11px; color:#04101f; font-weight:600; margin-bottom:8px; }
  #info table { width:100%; border-collapse:collapse; }
  #info td { padding:2px 0; vertical-align:top; }
  #info td:first-child { color:var(--dim); width:42%; }
  #info td:last-child { font-variant-numeric:tabular-nums; }
  #info h3 { font-size:12px; color:var(--acc); margin:10px 0 3px; border-bottom:1px solid var(--line); padding-bottom:2px; }
  #info a { color:var(--acc); text-decoration:none; display:inline-block; margin:2px 10px 2px 0; }
  #info a:hover { text-decoration:underline; }
  #info pre { font:10px Consolas,monospace; color:var(--dim); margin:4px 0 0; white-space:pre; overflow-x:auto; }
  #close { position:absolute; top:6px; right:8px; background:none; border:none; color:var(--dim); font-size:18px; cursor:pointer; }
  #tip { position:absolute; pointer-events:none; background:#000c; border:1px solid var(--line); border-radius:4px; padding:1px 7px; display:none; white-space:nowrap; }
  #hint { bottom:10px; left:50%; transform:translateX(-50%); padding:4px 12px; color:var(--dim); font-size:11px; white-space:nowrap; }
  #sky { padding:6px 12px; display:grid; grid-template-columns:1fr 1fr; gap:0 8px; }
  #sky label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  #labels { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .lbl { position:absolute; transform:translate(9px,-50%); font-size:11px; color:#b9c6da; text-shadow:0 0 3px #000,0 0 3px #000; white-space:nowrap; display:none; }
  .lbl.big { font-size:12px; color:#fff; font-weight:600; }
  @media (max-width:900px) {
    #left { width:230px; bottom:auto; height:46%; }
    #time { left:10px; right:250px; transform:none; flex-wrap:wrap; white-space:normal; }
    #clock { min-width:0; width:100%; }
    #info { top:80px; left:10px; width:250px; max-height:calc(100% - 90px); }
    #hint { display:none; }
  }
  #err {top:50%; left:50%; transform:translate(-50%,-50%); padding:20px; display:none; max-width:480px; }
</style>
</head>
<body>
<div id="view"></div>
<div id="labels"></div>

<div id="left" class="panel">
  <h1><span>🛰 全球衛星即時位置</span><button id="collapse" title="收合／展開選單">收合 »</button></h1>
  <div class="sub"><span id="datainfo">載入中…</span> <button id="refresh" title="立即從 CelesTrak 下載最新軌道資料（需連網）">⟳ 線上更新</button></div>
  <div class="sec">
    <div class="sechead">衛星分類</div>
    <div class="secbody">
      <div id="scheme"><button data-k="cat" class="on">依軌道</button><button data-k="pcat">依用途</button>
        <span id="catall"><button data-on="1">全選</button><button data-on="0">全不選</button></span></div>
      <div id="schemenote">以 CelesTrak 官方群組為主，未收錄者依名稱推定</div>
      <div id="cats"></div>
    </div>
  </div>
  <div class="sec">
    <div class="sechead">顯示圖層</div>
    <div class="secbody">
  <div id="sky">
    <label><input type="checkbox" checked id="sk_sunmoon">☀ 太陽／🌙 月球</label>
    <label><input type="checkbox" checked id="sk_stars">✦ 星空</label>
    <label><input type="checkbox" checked id="sk_ecl">◯ 黃道面</label>
    <label><input type="checkbox" checked id="sk_light">◐ 日夜光照</label>
    <label><input type="checkbox" checked id="sk_border">▱ 國界</label>
    <label><input type="checkbox" checked id="sk_grid">⌗ 經緯線</label>
    <label><input type="checkbox" checked id="sk_track">〰 日月地面軌跡</label>
    <label style="grid-column:1 / -1" title="把每顆衛星畫在它正下方的地表位置（星下點）"><input type="checkbox" id="sk_proj">⤓ 所有衛星投影到地表</label>
  </div>
    </div>
  </div>
  <div class="sec grow">
    <div class="sechead">衛星清單</div>
    <div class="secbody">
      <input id="search" placeholder="搜尋名稱或 NORAD 編號…" autocomplete="off">
      <div id="listinfo"></div>
      <div id="list"><div id="listinner"></div></div>
    </div>
  </div>
</div>

<div id="time" class="panel">
  <span id="clock"></span>
  <button data-s="0">⏸</button>
  <button data-s="1" class="on">1×</button>
  <button data-s="10">10×</button>
  <button data-s="60">60×</button>
  <button data-s="600">600×</button>
  <button id="now">現在</button>
</div>

<div id="info" class="panel"><button id="close" title="關閉">×</button><div id="infobody"></div></div>
<div id="tip"></div>
<div id="hint" class="panel">拖曳旋轉 · 滾輪縮放 · 點選衛星查看詳細資訊　｜　軌道資料 CelesTrak · 星空／太陽／月球／夜間貼圖 Solar System Scope (CC BY 4.0) · 國界 Natural Earth</div>
<div id="err" class="panel"></div>

    '<tr><td>NORAD 編號</td><td>' + esc(s.id) + '</td></tr>' +
    '<tr><td>國際編號</td><td>' + esc(ly + '-' + s.intl.substr(2)) + '</td></tr>' +
    '<tr><td>發射年份</td><td>' + ly + '</td></tr></table>' +
    '<h3>軌道參數</h3><table>' +
    '<tr><td>軌道週期</td><td>' + fmt(s.period, 1) + ' 分鐘（每日 ' + fmt(1440 / s.period, 2) + ' 圈）</td></tr>' +
    '<tr><td>軌道傾角</td><td>' + fmt(s.inc, 2) + '°</td></tr>' +
    '<tr><td>離心率</td><td>' + s.ecc.toFixed(6) + '</td></tr>' +
    '<tr><td>近地點高度</td><td>' + fmt(s.per, 0) + ' km</td></tr>' +
    '<tr><td>遠地點高度</td><td>' + fmt(s.apo, 0) + ' km</td></tr>' +
    '<tr><td>半長軸</td><td>' + fmt(s.a, 0) + ' km</td></tr>' +
    '<tr><td>資料曆元 (UTC)</td><td>' + ep.toISOString().slice(0, 16).replace('T', ' ') + '</td></tr></table>' +
    '<h3>外部連結（需連網）</h3>' +
    '<a target="_blank" rel="noopener" href="https://www.n2yo.com/satellite/?s=' + s.id + '">N2YO 即時追蹤</a>' +
    '<a target="_blank" rel="noopener" href="https://www.heavens-above.com/orbit.aspx?satid=' + s.id + '">Heavens-Above</a>' +
    '<a target="_blank" rel="noopener" href="https://celestrak.org/NORAD/elements/gp.php?CATNR=' + s.id + '&FORMAT=tle">CelesTrak 軌道資料</a>' +
    '<a target="_blank" rel="noopener" href="https://www.google.com/search?q=' + q + '">Google 搜尋</a>' +
    '<a target="_blank" rel="noopener" href="https://zh.wikipedia.org/w/index.php?search=' + encodeURIComponent(s.name) + '">維基百科</a>' +
    '<h3>TLE 原始資料</h3><pre>' + esc(s.l1) + '\n' + esc(s.l2) + '</pre>';
  lastOrbit = 0;
  if (focus) { propagateOne(i, new Date(simTime), satellite.gstime(new Date(simTime))); focusOn(i); }
}
document.getElementById('close').onclick = function () { select(-1); };
function focusOn(i) {
  var x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2], r = Math.sqrt(x * x + y * y + z * z);
  if (!r) return;
  cam.lat = Math.asin(y / r); cam.lon = Math.atan2(-z, x);
  if (cam.dist < r + 0.6) cam.dist = r + 1.5;
}
function updateSelected(date) {
  var s = sats[selected], gmst = satellite.gstime(date), pv;
  try { pv = satellite.propagate(s.rec, date); } catch (x) { return; }
  if (!pv || !pv.position) return;
  var g = satellite.eciToGeodetic(pv.position, gmst), lat = g.latitude * R2D, lon = g.longitude * R2D;
  if (lon > 180) lon -= 360; if (lon < -180) lon += 360;
  var o = selected * 3; propagateOne(selected, date, gmst);
  var m = marker.geometry.attributes.position; m.setXYZ(0, pos[o], pos[o + 1], pos[o + 2]); m.needsUpdate = true;
  // 垂直線一律從衛星的真實位置連到地心（投影模式下可看出衛星實際高度）
  var ncg = Math.cos(gmst), nsg = Math.sin(gmst), pp = pv.position;
  var nd = nadir.geometry.attributes.position;
  nd.setXYZ(0, (pp.x * ncg + pp.y * nsg) / RE, pp.z / RE, -(-pp.x * nsg + pp.y * ncg) / RE); nd.setXYZ(1, 0, 0, 0); nd.needsUpdate = true;
  var $ = function (id) { return document.getElementById(id); };
  if ($('i_lat')) {
    $('i_lat').textContent = Math.abs(lat).toFixed(3) + '° ' + (lat >= 0 ? 'N' : 'S');
    $('i_lon').textContent = Math.abs(lon).toFixed(3) + '° ' + (lon >= 0 ? 'E' : 'W');
    $('i_alt').textContent = fmt(g.height, 1) + ' km';
    $('i_vel').textContent = fmt(s.vel, 2) + ' km/s（' + fmt(s.vel * 3600, 0) + ' km/h）';
  }
  // 軌道線（慣性座標系下的一整圈）
  var now = performance.now();
  if (now - lastOrbit > 400) {
    lastOrbit = now;
    var cg = Math.cos(gmst), sg = Math.sin(gmst), T = s.period * 60000;
    for (var k = 0; k <= ORB; k++) {
      var p = null;
      try { p = satellite.propagate(s.rec, new Date(date.getTime() + T * k / ORB)).position; } catch (x) {}
      if (!p || isNaN(p.x)) { orbPos[k * 3] = pos[o]; orbPos[k * 3 + 1] = pos[o + 1]; orbPos[k * 3 + 2] = pos[o + 2]; continue; }
      orbPos[k * 3] = (p.x * cg + p.y * sg) / RE; orbPos[k * 3 + 1] = p.z / RE; orbPos[k * 3 + 2] = -(-p.x * sg + p.y * cg) / RE;
    }
    orbit.geometry.attributes.position.needsUpdate = true;
  }
}

// ---------- 左側清單 ----------
var catsEl = document.getElementById('cats'), listEl = document.getElementById('list'), inner = document.getElementById('listinner');
var searchEl = document.getElementById('search'), listInfo = document.getElementById('listinfo'), filtered = [], ROW = 22;
function buildCats() {
  catsEl.innerHTML = '';
  ACTIVE.forEach(function (c) {
    var l = document.createElement('label');
    l.title = c.desc;
    l.innerHTML = '<input type="checkbox"' + (c.on ? ' checked' : '') + ' id="cat_' + c.key + '"><span class="dot" style="background:' + c.color + '"></span>' +
      esc(c.name) + '<span class="n">' + c.count.toLocaleString() + '</span>';
    l.querySelector('input').onchange = function (e) { c.on = e.target.checked; fullPass = true; applyFilter(); };
    catsEl.appendChild(l);
  });
}
function setScheme(k) {
  CK = k; ACTIVE = SCHEMES[k];
  document.querySelectorAll('#scheme button').forEach(function (b) { b.classList.toggle('on', b.dataset.k === k); });
  document.getElementById('schemenote').style.display = k === 'pcat' ? 'block' : 'none';
  buildCats(); recolor(); fullPass = true; applyFilter();
}
document.querySelectorAll('#scheme button').forEach(function (b) { b.onclick = function () { setScheme(b.dataset.k); }; });
document.querySelectorAll('#catall button').forEach(function (b) {
  b.onclick = function () { var on = b.dataset.on === '1'; ACTIVE.forEach(function (c) { c.on = on; }); buildCats(); fullPass = true; applyFilter(); };
});
// 區塊收合
document.querySelectorAll('#left .sechead').forEach(function (h) {
  h.onclick = function () { h.parentNode.classList.toggle('closed'); renderList(); };
});
buildCats();
function applyFilter() {
  var q = searchEl.value.trim().toUpperCase(); filtered = [];
  for (var i = 0; i < N; i++) {
    var s = sats[i]; if (!C(s).on) continue;
    if (q && s.name.toUpperCase().indexOf(q) < 0 && s.id.indexOf(q) < 0) continue;
    filtered.push(i);
  }
  listInfo.textContent = '顯示 ' + filtered.length.toLocaleString() + ' / ' + N.toLocaleString() + ' 顆';
  inner.style.height = filtered.length * ROW + 'px';
  listEl.scrollTop = 0; renderList();
}
function renderList() {
  var top = listEl.scrollTop, h = listEl.clientHeight, a = Math.max(0, Math.floor(top / ROW) - 3), b = Math.min(filtered.length, Math.ceil((top + h) / ROW) + 3), html = '';
  for (var k = a; k < b; k++) {
    var i = filtered[k], s = sats[i];
    html += '<div class="row' + (i === selected ? ' sel' : '') + '" data-i="' + i + '" style="top:' + k * ROW + 'px"><span class="dot" style="background:' +
      C(s).color + '"></span>' + esc(s.name) + '<span class="id">' + esc(s.id) + '</span></div>';
  }
  inner.innerHTML = html;
}
listEl.addEventListener('scroll', renderList);
window.addEventListener('resize', renderList);
inner.addEventListener('click', function (e) { var r = e.target.closest('.row'); if (r) select(+r.dataset.i, true); });
searchEl.addEventListener('input', applyFilter);
applyFilter();

// ---------- 主迴圈 ----------
var lastClock = 0;
function frame() {
  requestAnimationFrame(frame);
  var nowR = performance.now(), dt = Math.min(nowR - lastReal, 250); lastReal = nowR;
  simTime += dt * speed;
  var date = new Date(simTime);
  step(date, 7);
  if (selected >= 0) updateSelected(date);
  updateSky(simTime, satellite.gstime(date));
  updateTracks(simTime);
  updateStations();
  placeCamera();
  renderer.render(scene, camera);
  updateLabels();
  if (nowR - lastClock > 200) {
    lastClock = nowR;
    sunLabel.el.textContent = '太陽 · ' + fmt(skyState.sunAU * 1.495979, 3) + ' 億 km（放大 ' + SUN_ZOOM + ' 倍、距離未按比例）';
    moonLabel.el.textContent = '月球 · ' + fmt(skyState.moonKm, 0) + ' km · ' + PHASES[Math.floor((skyState.phase + 22.5) / 45) % 8] + '（放大 ' + MOON_ZOOM + ' 倍）';
    clock.textContent = fmtLocal(date) + '（UTC ' + date.toISOString().slice(11, 19) + '）';
    if (hoverXY && !drag) {
      var h = pick(hoverXY.x, hoverXY.y, 8);
      if (h >= 0) { tip.textContent = sats[h].name; tip.style.display = 'block'; tip.style.left = hoverXY.x + 14 + 'px'; tip.style.top = hoverXY.y + 10 + 'px'; el.style.cursor = 'pointer'; }
      else { tip.style.display = 'none'; el.style.cursor = 'grab'; }
    }
  }
}
window.__sat = { sats:sats, select:select, cats:CATS, pcats:PCATS, setScheme:setScheme, cam:cam, sky:function () { return skyState; },
  sublunar:function () { var p = moon.position.clone().applyMatrix4(sky.matrixWorld), r = p.length(); p.normalize(); return { lat:Math.asin(p.y) * R2D, lon:Math.atan2(-p.z, p.x) * R2D, r:r }; },
  subsolar:function () { var p = sunSprite.position.clone().applyMatrix4(sky.matrixWorld).normalize(); return { lat:Math.asin(p.y) * R2D, lon:Math.atan2(-p.z, p.x) * R2D }; } };
frame();
}

// ---------- 啟動：決定用哪一份軌道資料，再啟動主程式 ----------
// 優先順序：線上最新（資料超過一天且有網路時自動下載）→ 先前下載並存在瀏覽器裡的 → 資料夾內建的 data/tle.js
(function boot() {
  var LIVE_URL = 'https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle', MAX_AGE = 24 * 3600000;
  var bundledT = Date.parse(window.TLE_FETCHED || '') || 0;
  window.TLE_SOURCE = '內建資料';
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open('sat-tracker', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); };
    });
  }
  function getCache() {
    return openDB().then(function (db) {
      return new Promise(function (res) {
        var q = db.transaction('kv').objectStore('kv').get('tle');
        q.onsuccess = function () { res(q.result || null); }; q.onerror = function () { res(null); };
      });
    }).catch(function () { return null; });
  }
  function putCache(v) {
    return openDB().then(function (db) {
      return new Promise(function (res) {
        var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, 'tle');
        t.oncomplete = res; t.onerror = res; t.onabort = res;
      });
    }).catch(function () {});
  }
  function valid(t) { return typeof t === 'string' && (t.match(/^1 \d{5}/gm) || []).length > 100; }
  function fetchLive() {
    var ctl = new AbortController(), timer = setTimeout(function () { ctl.abort(); }, 15000);
    return fetch(LIVE_URL, { signal:ctl.signal, cache:'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function (t) {
      clearTimeout(timer); t = t.replace(/\r/g, '');
      if (!valid(t)) throw new Error('回傳內容不是 TLE');
      return t;
    });
  }
  function hhmm(ms) { var d = new Date(ms), p = function (n) { return (n < 10 ? '0' : '') + n; }; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
  var info = document.getElementById('datainfo'), btn = document.getElementById('refresh');
  btn.onclick = function () {
    btn.disabled = true; btn.textContent = '下載中…';
    fetchLive().then(function (t) { return putCache({ t:Date.now(), tle:t }); })
      .then(function () { location.reload(); })
      .catch(function (e) {
        var m = String(e && e.message || e), limited = /HTTP 403/.test(m);   // CelesTrak 同一份資料兩小時內重複下載會回 403
        btn.disabled = false; btn.textContent = limited ? '⟳ 已是最新，稍後再試' : '⟳ 更新失敗，重試';
        btn.title = limited ? 'CelesTrak 限制同一份資料兩小時內不可重複下載，目前的資料已是最新' : m;
      });
  };
  getCache().then(function (c) {
    var bestT = bundledT;
    if (c && c.t > bundledT && valid(c.tle)) { window.TLE_DATA = c.tle; bestT = c.t; window.TLE_SOURCE = '線上下載（' + hhmm(c.t) + '）'; }
    if (Date.now() - bestT > MAX_AGE && navigator.onLine !== false) {
      info.textContent = '正在線上下載最新軌道資料…';
      return fetchLive().then(function (t) {
        window.TLE_DATA = t; window.TLE_SOURCE = '線上下載（' + hhmm(Date.now()) + '）';
        return putCache({ t:Date.now(), tle:t });
      }).catch(function () { window.TLE_SOURCE += '；線上更新失敗，可能沒有網路'; });
    }
  }).then(main, main);
})();
</script>
